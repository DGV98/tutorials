# Generated by lua_tutorial/08_capstone_hyprland — edit the .lua, not this file.

$mainMod = SUPER

monitor = eDP-1, 1920x1080@60, 0x0, 1
monitor = DP-1, 2560x1440@60, auto-up, 1
monitor = DP-4, 1920x1080@180, 1920x0, 1
monitor = DP-3, 1920x1080@180, 3840x0, 1
monitor = HDMI-A-1, 1920x1080, 1920x0, 1

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = hyprpaper
exec-once = sh -c 'sleep 1 && ghostty -e nvim ~/todos.md'

general {
    border_size = 1
    gaps_in = 3
    gaps_out = 3
    layout = dwindle
    resize_on_border = true
}

decoration {
    active_opacity = 0.75
    inactive_opacity = 0.6
    rounding = 10
    blur {
        enabled = true
        passes = 1
        size = 3
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
    }
}

input {
    follow_mouse = 1
    kb_layout = us
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

dwindle {
    preserve_split = true
    pseudotile = true
}

bind = $mainMod, Q, exec, ghostty
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bindm = $mainMod, mouse:272, movewindow,
bindm = $mainMod, mouse:273, resizewindow,
